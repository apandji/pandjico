<!DOCTYPE html>
<html lang="en" data-appearance="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta
        name="description"
        content="All works — Andrew Pandji: projects, experiments, and case studies with filters and timeline."
    >
    <meta name="theme-color" id="dynamic-theme-color" content="hsl(232 26% 5%)">
    <meta name="view-transition" content="same-origin">
    <title>works — Andrew Pandji</title>
    <link
        rel="icon"
        type="image/svg+xml"
        id="dynamic-favicon"
        href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2032%2032'%3E%3Ccircle%20cx%3D'16'%20cy%3D'16'%20r%3D'15'%20fill%3D'hsl(232%2026%25%205%25)'%2F%3E%3C%2Fsvg%3E"
    />
    <link rel="preload" href="../fonts/Ronzino-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="preload" href="../js/adapt-hero.js" as="script" fetchpriority="high">
    <script src="../js/adapt-hero.js" fetchpriority="high"></script>
    <script src="../js/cursor-typewriter-chip.js" defer></script>
    <script src="../js/cursor-atmosphere.js" defer></script>
    <script src="../js/work-cards.js" defer></script>
    <script src="../js/frost-tooltip.js" defer></script>
    <script src="../js/sky-typewriter-hint.js" defer></script>
    <script src="../js/works-index.js" defer></script>
</head>
<body>
    <a class="skip-link" href="#main">Skip to projects</a>
    <div class="works-page">
        <header class="works-toolbar" aria-label="Works">
            <div class="works-toolbar__bar">
                <div class="works-toolbar__controls">
                    <div class="works-toolbar__tag-line">
                        <nav class="works-toolbar__home" aria-label="Site">
                            <a class="works-toolbar__home-mark" href="../index.html" aria-label="Back to home">
                                <span class="works-toolbar__home-glyph" aria-hidden="true">
                                    <svg
                                        class="works-toolbar__home-svg"
                                        width="22"
                                        height="22"
                                        viewBox="0 0 24 24"
                                        fill="none"
                                        xmlns="http://www.w3.org/2000/svg"
                                    >
                                        <g class="works-toolbar__home-phase works-toolbar__home-phase--dot">
                                            <circle cx="12" cy="12" r="5.25" fill="currentColor" />
                                        </g>
                                        <g
                                            class="works-toolbar__home-phase works-toolbar__home-phase--house"
                                            fill="none"
                                            stroke="currentColor"
                                            stroke-width="1.5"
                                            stroke-linecap="round"
                                            stroke-linejoin="round"
                                        >
                                            <path
                                                d="M2 8L11.7317 3.13416C11.9006 3.04971 12.0994 3.0497 12.2683 3.13416L22 8"
                                            />
                                            <path
                                                d="M20 11V19C20 20.1046 19.1046 21 18 21H6C4.89543 21 4 20.1046 4 19V11"
                                            />
                                        </g>
                                    </svg>
                                </span>
                                <span
                                    class="works-hover-tip works-home-tip"
                                    id="works-home-tip"
                                    role="tooltip"
                                    aria-hidden="true"
                                >
                                    <span class="works-home-tip__text"></span><span
                                        class="works-home-tip__caret sky-cursor-type__caret"
                                        aria-hidden="true"
                                    ></span>
                                </span>
                            </a>
                        </nav>
                        <div class="works-toolbar__filter-cluster" role="toolbar" aria-label="Tags and clear filters">
                            <div class="works-toolbar__group works-toolbar__group--tags" role="group" aria-label="Tags and clear">
                                <span class="works-toolbar__inline-label">tags</span>
                                <div class="works-toolbar__tags-with-clear">
                                    <div class="works-tag-row" id="works-tag-container"></div>
                                    <button
                                        type="button"
                                        class="works-outline-toggle works-outline-toggle--icon works-outline-toggle--tag-clear"
                                        id="works-clear-tags"
                                        aria-label="Clear filters"
                                    >
                                        <svg
                                            class="works-outline-toggle__svg"
                                            width="22"
                                            height="22"
                                            viewBox="0 0 24 24"
                                            fill="none"
                                            xmlns="http://www.w3.org/2000/svg"
                                            aria-hidden="true"
                                        >
                                            <path
                                                d="M18 6L6 18M6 6l12 12"
                                                stroke="currentColor"
                                                stroke-width="1.5"
                                                stroke-linecap="round"
                                                stroke-linejoin="round"
                                            />
                                        </svg>
                                        <span class="works-hover-tip" role="tooltip">Clear filters</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="works-toolbar__view-aside">
                            <div class="works-toolbar__group works-toolbar__group--sort" role="group" aria-label="Sort">
                                <span class="works-toolbar__inline-label">sort</span>
                                <div class="works-toolbar__sort-strip" role="group" aria-label="Sort projects">
                                    <button
                                        type="button"
                                        class="works-outline-toggle works-outline-toggle--mono"
                                        id="works-sort-timeline"
                                        aria-pressed="true"
                                    >
                                        <span class="works-outline-toggle__mono" id="works-sort-timeline-label">PAST→NOW</span>
                                        <span class="works-hover-tip" id="works-sort-timeline-tip" role="tooltip"></span>
                                    </button>
                                    <button
                                        type="button"
                                        class="works-outline-toggle works-outline-toggle--mono"
                                        id="works-sort-title"
                                        aria-pressed="false"
                                    >
                                        <span class="works-outline-toggle__mono" id="works-sort-title-label">A→Z</span>
                                        <span class="works-hover-tip" id="works-sort-title-tip" role="tooltip"></span>
                                    </button>
                                </div>
                            </div>
                            <div class="works-toolbar__show-as" role="group" aria-labelledby="works-show-as-label">
                                <span class="works-toolbar__inline-label" id="works-show-as-label">show as</span>
                                <div class="works-view-strip" role="group" aria-label="Layout">
                                    <button
                                        type="button"
                                        class="works-outline-toggle"
                                        id="works-view-masonry"
                                        aria-pressed="true"
                                        aria-label="Mosaic layout"
                                    >
                                        <svg
                                            class="works-outline-toggle__svg"
                                            width="22"
                                            height="22"
                                            viewBox="0 0 24 24"
                                            fill="none"
                                            xmlns="http://www.w3.org/2000/svg"
                                            aria-hidden="true"
                                        >
                                            <rect
                                                x="3"
                                                y="3"
                                                width="7"
                                                height="7"
                                                rx="1.5"
                                                stroke="currentColor"
                                                stroke-width="1.5"
                                            />
                                            <rect
                                                x="14"
                                                y="3"
                                                width="7"
                                                height="7"
                                                rx="1.5"
                                                stroke="currentColor"
                                                stroke-width="1.5"
                                            />
                                            <rect
                                                x="3"
                                                y="14"
                                                width="7"
                                                height="7"
                                                rx="1.5"
                                                stroke="currentColor"
                                                stroke-width="1.5"
                                            />
                                            <rect
                                                x="14"
                                                y="14"
                                                width="7"
                                                height="7"
                                                rx="1.5"
                                                stroke="currentColor"
                                                stroke-width="1.5"
                                            />
                                        </svg>
                                        <span class="works-hover-tip" role="tooltip">Mosaic</span>
                                    </button>
                                    <button
                                        type="button"
                                        class="works-outline-toggle"
                                        id="works-view-list"
                                        aria-pressed="false"
                                        aria-label="List layout"
                                    >
                                        <svg
                                            class="works-outline-toggle__svg"
                                            width="22"
                                            height="22"
                                            viewBox="0 0 24 24"
                                            fill="none"
                                            xmlns="http://www.w3.org/2000/svg"
                                            aria-hidden="true"
                                        >
                                            <path
                                                d="M8 6h14M8 12h14M8 18h14M4 6h.01M4 12h.01M4 18h.01"
                                                stroke="currentColor"
                                                stroke-width="1.5"
                                                stroke-linecap="round"
                                                stroke-linejoin="round"
                                            />
                                        </svg>
                                        <span class="works-hover-tip" role="tooltip">List</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="works-toolbar__head">
                <h1 class="works-toolbar__title" id="works-dynamic-title">works : all</h1>
            </div>
            <p id="works-live" class="visually-hidden" aria-live="polite" aria-atomic="true"></p>
        </header>

        <main class="works-main work-rail" id="main" data-works-layout="masonry">
            <h2 class="visually-hidden">All projects</h2>
            <!-- Injected from projects.json by js/works-index.js -->
        </main>
    </div>

    <footer class="time-footer" role="contentinfo">
        <div class="time-footer__toy" id="footer-toy">
            <div class="time-footer__inner">
                <div class="time-footer__row">
                    <div class="time-footer__group-shell">
                        <div class="time-footer__group">
                            <div class="time-footer__sky-wrap">
                                <p
                                    class="frost-tooltip sky-ui-chip"
                                    id="footer-toy-tip"
                                    role="tooltip"
                                >
                                    <span class="frost-tooltip__text"
                                        >site's colors change based on time of day; default is my home, st. louis, where this
                                        site was crafted. click to use your own sky instead.</span>
                                </p>
                                <button
                                    type="button"
                                    class="time-footer__sky-toggle"
                                    id="footer-sky-toggle"
                                    aria-pressed="false"
                                    aria-label="Use your local sky instead of St. Louis"
                                >
                                    <svg
                                        class="time-footer__sky-svg"
                                        width="24"
                                        height="24"
                                        viewBox="0 0 24 24"
                                        fill="none"
                                        xmlns="http://www.w3.org/2000/svg"
                                        aria-hidden="true"
                                    >
                                        <path
                                            d="M20 10C20 14.4183 12 22 12 22C12 22 4 14.4183 4 10C4 5.58172 7.58172 2 12 2C16.4183 2 20 5.58172 20 10Z"
                                            stroke="currentColor"
                                            stroke-width="1.5"
                                        ></path>
                                        <path
                                            d="M12 11C12.5523 11 13 10.5523 13 10C13 9.44772 12.5523 9 12 9C11.4477 9 11 9.44772 11 10C11 10.5523 11.4477 11 12 11Z"
                                            fill="currentColor"
                                            stroke="currentColor"
                                            stroke-width="1.5"
                                            stroke-linecap="round"
                                            stroke-linejoin="round"
                                        ></path>
                                    </svg>
                                </button>
                            </div>
                            <p class="time-footer__caption" id="footer-caption"></p>
                        </div>
                    </div>
                    <div
                        class="time-footer__extras"
                        aria-label="Additional footer links or notes"
                        role="region"
                    >
                        <button
                            type="button"
                            class="time-footer__extras-dial"
                            id="footer-extras-dial"
                            aria-label="Open scene tools"
                            title="Click: toggle sky &amp; geo lab · Shift+click: toggle scene time slider · Alt+click: turn off lab &amp; scene debug · Or use ?lab=0 / ?sceneDebug=0"
                        >
                            ⁘
                        </button>
                    </div>
                </div>
                <p class="time-footer__lab" id="footer-lab" hidden aria-hidden="true"></p>
                <div class="time-footer__geo-debug" id="footer-geo-debug" hidden aria-hidden="true">
                    <div class="time-footer__geo-debug-row">
                        <label class="time-footer__geo-debug-label"
                            >lat
                            <input
                                class="time-footer__geo-debug-input"
                                id="footer-debug-lat"
                                type="text"
                                inputmode="decimal"
                                autocomplete="off"
                                spellcheck="false"
                                aria-label="Debug latitude"
                            />
                        </label>
                        <label class="time-footer__geo-debug-label"
                            >lon
                            <input
                                class="time-footer__geo-debug-input"
                                id="footer-debug-lon"
                                type="text"
                                inputmode="decimal"
                                autocomplete="off"
                                spellcheck="false"
                                aria-label="Debug longitude"
                            />
                        </label>
                        <button type="button" class="time-footer__geo-debug-btn" id="footer-debug-apply">
                            apply
                        </button>
                        <button type="button" class="time-footer__geo-debug-btn" id="footer-debug-random">
                            random city
                        </button>
                        <button type="button" class="time-footer__geo-debug-btn" id="footer-debug-clear">
                            clear override
                        </button>
                        <button type="button" class="time-footer__geo-debug-btn" id="footer-debug-copy">
                            copy coords
                        </button>
                    </div>
                    <p class="time-footer__geo-debug-hint" id="footer-geo-debug-hint"></p>
                </div>
            </div>
        </div>
    </footer>
    <script src="../js/lab-egg.js" defer></script>
    <script src="../js/register-sw.js" defer></script>
</body>
</html>
